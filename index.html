<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>展品相機對準測試－相機優先 v7</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
  background: #f3ead8;
  color: #281b0e;
}

main {
  max-width: 620px;
  margin: auto;
}

h1 {
  font-size: 1.5rem;
}

button {
  width: 100%;
  min-height: 72px;
  margin: 10px 0;
  border: 2px solid #281b0e;
  border-radius: 16px;
  background: #fffaf0;
  color: #281b0e;
  font-size: 1.25rem;
  font-weight: 700;
}

#statusVisible {
  min-height: 72px;
  margin: 16px 0;
  padding: 14px;
  background: #fffaf0;
  border-radius: 14px;
  font-size: 1.08rem;
  line-height: 1.5;
}

#preview {
  display: block;
  width: 100%;
  margin-top: 14px;
  border-radius: 14px;
  background: #000;
}

#debug {
  margin-top: 10px;
  padding: 10px;
  background: rgba(255,255,255,.55);
  border-radius: 10px;
  font-size: .88rem;
}

video,
#workCanvas,
.reference {
  display: none;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0,0,0,0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
</style>
</head>

<body>
<main>
  <h1>展品相機對準測試 v7</h1>

  <button id="startButton">開始相機導覽</button>
  <button id="stopButton" hidden>結束相機導覽</button>

  <div id="statusVisible">
    照片資料準備中。按開始後會先開相機，方向語音在背景準備。
  </div>

  <!--
    導航中的方向提示主要由網站自己的語音播放。
    如果瀏覽器不支援 speechSynthesis，才使用這個 aria-live 當備援。
  -->
  <div id="liveRegion"
       class="sr-only"
       role="status"
       aria-live="polite"
       aria-atomic="true"></div>

  <canvas id="preview"
          width="200"
          height="150"
          aria-hidden="true"></canvas>

  <div id="debug" aria-hidden="true">
    尚未開始辨識。
  </div>

  <video id="video"
         autoplay
         muted
         playsinline
         aria-hidden="true"></video>

  <canvas id="workCanvas"
          aria-hidden="true"></canvas>

  <img id="ref1"
       class="reference"
       src="./p1.jpg"
       alt="">

  <img id="ref2"
       class="reference"
       src="./p2.jpg"
       alt="">

  <!--
    方向提示使用預先載入的小型 MP3，
    避免即時 speechSynthesis 跟不上相機判斷。
    這些元素不給螢幕閱讀器當控制項。
  -->
  <div hidden aria-hidden="true">
    <audio id="cue-start" src="./cues/start.mp3" preload="auto"></audio>
    <audio id="cue-search" src="./cues/search.mp3" preload="auto"></audio>
    <audio id="cue-near_left" src="./cues/near_left.mp3" preload="auto"></audio>
    <audio id="cue-near_right" src="./cues/near_right.mp3" preload="auto"></audio>
    <audio id="cue-near_up" src="./cues/near_up.mp3" preload="auto"></audio>
    <audio id="cue-near_down" src="./cues/near_down.mp3" preload="auto"></audio>
    <audio id="cue-near_center" src="./cues/near_center.mp3" preload="auto"></audio>
    <audio id="cue-found" src="./cues/found.mp3" preload="auto"></audio>
    <audio id="cue-left" src="./cues/left.mp3" preload="auto"></audio>
    <audio id="cue-right" src="./cues/right.mp3" preload="auto"></audio>
    <audio id="cue-up" src="./cues/up.mp3" preload="auto"></audio>
    <audio id="cue-down" src="./cues/down.mp3" preload="auto"></audio>
    <audio id="cue-stop" src="./cues/stop.mp3" preload="auto"></audio>
    <audio id="cue-complete" src="./cues/complete.mp3" preload="auto"></audio>
  </div>

</main>

<script>
/*
========================================================
輕量修正版 v2

修正：
1. 不再用 8x8 粗比對，改成 12x12 明暗 + 邊緣梯度雙重比對。
2. 必須連續數幀在相近位置找到同一件展品才承認「找到」。
3. 未確認前不畫綠框，也不給左/右方向，避免誤導。
4. 語音提示改成網站直接 speechSynthesis，不再需要勾選測試語音。
5. 仍然完全不用 OpenCV / WASM。
6. 永遠只叫使用者「轉動手機」，不提供行走指令。
========================================================
*/

const FRAME_W = 200;
const GRID = 12;
const ANALYZE_MS = 260;

/*
  如果太容易誤認：
  0.73 -> 0.76 -> 0.80

  如果真的照片很難認出：
  0.73 -> 0.70
*/
const MATCH_THRESHOLD = 0.73;

/*
  明暗相似度與邊緣相似度都要達基本門檻，
  不能只靠一個粗略總分。
*/
const MIN_LUMA_SCORE = 0.67;
const MIN_GRAD_SCORE = 0.45;

/*
  「疑似展品」門檻。
  尚未達到正式辨識標準時，若候選影像在同一方向穩定出現，
  先給「左側/右側疑似有展品」的探索提示。
  這不是正式辨識，所以語音會明確說「疑似」。
*/
const NEAR_SCORE = 0.53;
const NEAR_LUMA_SCORE = 0.48;
const NEAR_GRAD_SCORE = 0.18;

/*
  正式辨識要連續 3 幀；
  疑似方向提示也至少要穩定 3 幀，避免綠框亂跳時誤導。
*/
const REQUIRED_CONFIRM_FRAMES = 3;
const REQUIRED_NEAR_FRAMES = 3;

/*
  展品中心進入畫面中央這個容許範圍才算接近對準。
*/
const CENTER_TOL_X = 0.13;
const CENTER_TOL_Y = 0.13;

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const statusVisible = document.getElementById("statusVisible");
const liveRegion = document.getElementById("liveRegion");
const debug = document.getElementById("debug");

const video = document.getElementById("video");
const workCanvas = document.getElementById("workCanvas");
const preview = document.getElementById("preview");

const workCtx = workCanvas.getContext("2d", {
  willReadFrequently: true
});

const previewCtx = preview.getContext("2d");

let references = [];

let stream = null;
let running = false;
let timer = null;

let candidate = null;
let candidateFrames = 0;
let confirmed = false;
let centeredFrames = 0;
let completed = false;

/*
  語音不再每次辨識更新就 cancel()。
  改成排隊：一句講完，才講下一句。
*/
let speechQueue = [];
let speechBusy = false;

let lastSpoken = "";
let lastSpokenAt = 0;
let lastSpeechKind = "";

let lastDirection = "";
let lastDirectionAt = 0;
let lastSearchAt = 0;
let lastNearAt = 0;

/*
  方向穩定判斷：
  要連續兩個影像判斷都是同方向，才真的說出口。
  避免鏡頭在中央附近晃一下就「左、右、左、右」。
*/
let rawDirectionKey = "";
let rawDirectionFrames = 0;
let stableDirectionKey = "";

/* =====================================================
   v6：兩字方向語音
   只說：向左 / 向右 / 向上 / 向下
   使用 Web Audio 預載 WAV，方向改變時直接切掉舊聲音。
===================================================== */

let dirAudioContext = null;
let dirAudioBuffers = {};
let dirAudioReady = false;
let activeDirSource = null;

const DIR_FILES = {
  left: "./cues/left.wav",
  right: "./cues/right.wav",
  up: "./cues/up.wav",
  down: "./cues/down.wav"
};

const DIR_TEXT = {
  left: "向左",
  right: "向右",
  up: "向上",
  down: "向下"
};


async function prepareDirAudio() {
  if (dirAudioReady) return;

  try {
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioCtx) {
      console.warn(
        "Web Audio API 不支援，方向文字仍可使用。"
      );
      return;
    }

    if (!dirAudioContext) {
      dirAudioContext =
        new AudioCtx({
          latencyHint: "interactive"
        });
    }

    const entries =
      Object.entries(DIR_FILES);

    const loaded =
      await Promise.allSettled(
        entries.map(async ([key, url]) => {
          const r =
            await fetch(url, {
              cache: "force-cache"
            });

          if (!r.ok) {
            throw new Error(
              "音檔 HTTP " +
              r.status +
              "：" +
              url
            );
          }

          const b =
            await r.arrayBuffer();

          dirAudioBuffers[key] =
            await dirAudioContext
              .decodeAudioData(b);
        })
      );

    const successCount =
      loaded.filter(
        x => x.status === "fulfilled"
      ).length;

    dirAudioReady =
      successCount > 0;

    console.log(
      "方向音檔載入：" +
      successCount +
      "/4"
    );

  } catch (error) {
    /*
      只記錄，不向上丟錯。
      相機功能不能因為方向聲音失敗而壞掉。
    */
    console.warn(
      "方向語音準備失敗，但相機仍可使用：",
      error
    );
  }
}


async function unlockDirAudio() {
  /*
    這個函式現在只負責「解鎖 AudioContext」，
    絕對不等待 WAV 下載 / 解碼。
    所以音訊就算失敗，也不會擋住相機。
  */
  try {
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioCtx) return;

    if (!dirAudioContext) {
      dirAudioContext =
        new AudioCtx({
          latencyHint: "interactive"
        });
    }

    if (
      dirAudioContext.state !== "running"
    ) {
      await dirAudioContext.resume();
    }

  } catch (error) {
    console.warn(
      "方向音訊解鎖失敗，但相機仍會繼續：",
      error
    );
  }
}


function stopDirAudio() {
  if (activeDirSource) {
    try {
      activeDirSource.stop();
    } catch (_) {}

    activeDirSource = null;
  }
}


/*
  唯一的方向輸出。
  文字與聲音都在這一個函式裡觸發。
*/
function outputDirection(key) {
  const text =
    DIR_TEXT[key];

  if (!text) return;

  /*
    新方向來了，舊聲音立即停止。
  */
  stopDirAudio();

  if (
    dirAudioReady &&
    dirAudioContext &&
    dirAudioContext.state === "running" &&
    dirAudioBuffers[key]
  ) {
    try {
      const source =
        dirAudioContext
          .createBufferSource();

      source.buffer =
        dirAudioBuffers[key];

      source.connect(
        dirAudioContext.destination
      );

      activeDirSource =
        source;

      source.onended = () => {
        if (
          activeDirSource === source
        ) {
          activeDirSource = null;
        }
      };

      /*
        直接現在播放，不排隊。
      */
      source.start(0);

    } catch (e) {
      console.error(
        "方向聲音播放失敗",
        e
      );
    }
  }

  /*
    與聲音同一個函式內更新文字。
  */
  statusVisible.textContent =
    text;
}


/*
  v5：即時短語音檔播放器。
  方向文字維持即時；聲音改用預載 MP3。
*/
let activeCueAudio = null;
let activeCueKey = "";
let lastCueKey = "";
let lastCueAt = 0;
let guidanceAudioEnabled = false;

function cueElement(key) {
  return document.getElementById("cue-" + key);
}


/*
  播放新的方向時：
  立即停止舊方向音檔。
  所以「向左」尚未播完時如果判斷變成右，
  會直接切成「向右」。
*/
function playCue(key, options = {}) {
  const {
    force = false,
    onEnded = null
  } = options;

  const now = Date.now();

  if (
    !force &&
    key === lastCueKey &&
    now - lastCueAt < 1150
  ) {
    return;
  }

  lastCueKey = key;
  lastCueAt = now;

  if (activeCueAudio) {
    try {
      activeCueAudio.pause();
      activeCueAudio.currentTime = 0;
    } catch (_) {}
  }

  const audio = cueElement(key);
  if (!audio) {
    if (onEnded) onEnded();
    return;
  }

  activeCueAudio = audio;
  activeCueKey = key;

  try {
    audio.pause();
    audio.currentTime = 0;
  } catch (_) {}

  audio.onended = () => {
    if (activeCueAudio === audio) {
      activeCueAudio = null;
      activeCueKey = "";
    }
    if (onEnded) onEnded();
  };

  audio.onerror = () => {
    if (onEnded) onEnded();
  };

  const p = audio.play();

  if (p && typeof p.catch === "function") {
    p.catch(() => {
      if (onEnded) onEnded();
    });
  }
}


/*
  在使用者按「開始」的手勢中喚醒所有 audio，
  避免之後 Android 阻擋自動播放。
*/
async function unlockCueAudio() {
  const keys = Object.keys({
    start:1, search:1,
    near_left:1, near_right:1, near_up:1, near_down:1, near_center:1,
    found:1, left:1, right:1, up:1, down:1, stop:1, complete:1
  });

  for (const key of keys) {
    const a = cueElement(key);
    if (!a) continue;

    try {
      const oldVolume = a.volume;
      a.volume = 0;

      const p = a.play();
      if (p && typeof p.then === "function") {
        await p.catch(() => {});
      }

      a.pause();
      a.currentTime = 0;
      a.volume = oldVolume;
    } catch (_) {}
  }
}


function stopCueAudio() {
  if (activeCueAudio) {
    try {
      activeCueAudio.pause();
      activeCueAudio.currentTime = 0;
    } catch (_) {}
  }

  activeCueAudio = null;
  activeCueKey = "";
}


/*
  語音分兩類：
  normal = 安全說明、找到展品、完成提示，不隨便切斷。
  direction / near / search = 即時導引，可以被新方向取代。
*/
let currentSpeechKind = "";
let currentSpeechText = "";
let pendingGuidance = null;
let speechToken = 0;


/* -----------------------------------------------------
   小工具
----------------------------------------------------- */

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}


/* -----------------------------------------------------
   語音提示

   這次不再要求使用者勾任何東西。
   按「開始相機導覽」後直接說話。
----------------------------------------------------- */

function isGuidanceKind(kind) {
  return (
    kind === "direction" ||
    kind === "near" ||
    kind === "search"
  );
}


/*
  主畫面文字只在「這句真的開始說」時更新。
  所以不會再出現畫面顯示「左」，聲音卻還在講「右」。
*/
function setSpokenStatus(message) {
  statusVisible.textContent = message;
}


/*
  共用入口。
*/
function speak(message, kind = "normal", force = false) {
  if (isGuidanceKind(kind)) {
    requestGuidance(message, kind);
    return;
  }

  queueNormalSpeech(message, force);
}


/*
  安全說明 / 找到展品 / 完成：
  這類句子不會被一般方向更新切斷。
*/
function queueNormalSpeech(message, force = false) {
  const now = Date.now();

  if (
    !force &&
    message === lastSpoken &&
    now - lastSpokenAt < 1200
  ) {
    return;
  }

  lastSpoken = message;
  lastSpokenAt = now;
  lastSpeechKind = "normal";

  /*
    進入重要狀態時，舊的尚未播放方向已經沒有意義。
  */
  if (force) {
    pendingGuidance = null;
    speechQueue = [];
  }

  /*
    如果目前正在講舊的方向，可以中止舊方向，
    讓重要狀態說明接手。
  */
  if (
    speechBusy &&
    isGuidanceKind(currentSpeechKind)
  ) {
    interruptCurrentSpeech();
  }

  if (!speechQueue.some(item => item.message === message)) {
    speechQueue.push({
      message,
      kind: "normal"
    });
  }

  playNextSpeech();
}


/*
  左右上下 / 搜尋狀態：
  永遠只保留「最新的一句」。
  人轉過頭時，新方向可以把舊方向立即換掉。
*/
function requestGuidance(message, kind) {
  const now = Date.now();

  /*
    同一句不要高頻重播。
  */
  const sameGap =
    kind === "direction" ? 1300 :
    kind === "near"      ? 2200 :
                           4200;

  if (
    message === lastSpoken &&
    now - lastSpokenAt < sameGap
  ) {
    return;
  }

  lastSpoken = message;
  lastSpokenAt = now;
  lastSpeechKind = kind;

  pendingGuidance = {
    message,
    kind
  };

  /*
    如果現在正在說的是安全說明等 normal，
    先讓它說完；但 pendingGuidance 會一直被最新方向覆蓋，
    所以說明結束後只會播「最新方向」，不播過時方向。
  */
  if (
    speechBusy &&
    currentSpeechKind === "normal"
  ) {
    return;
  }

  /*
    如果正在說舊方向，而且方向已改，
    立刻停止舊方向。
  */
  if (
    speechBusy &&
    isGuidanceKind(currentSpeechKind)
  ) {
    if (currentSpeechText !== message) {
      interruptCurrentSpeech();
    } else {
      return;
    }
  }

  playNextSpeech();
}


/*
  只用於「方向類」舊語音已經過時的情況。
*/
function interruptCurrentSpeech() {
  speechToken++;

  speechBusy = false;
  currentSpeechKind = "";
  currentSpeechText = "";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  setTimeout(playNextSpeech, 70);
}


function playNextSpeech() {
  if (speechBusy) {
    return;
  }

  let item = null;

  /*
    重要 normal 句子優先。
  */
  if (speechQueue.length > 0) {
    item = speechQueue.shift();

  } else if (pendingGuidance) {
    /*
      方向類只取「目前最新的一句」。
    */
    item = pendingGuidance;
    pendingGuidance = null;
  }

  if (!item) {
    return;
  }

  const message = item.message;
  const kind = item.kind;

  /*
    文字與聲音從這一刻才一起更新。
  */
  setSpokenStatus(message);

  if ("speechSynthesis" in window) {
    try {
      speechBusy = true;
      currentSpeechKind = kind;
      currentSpeechText = message;

      window.speechSynthesis.resume();

      const myToken = ++speechToken;

      const u =
        new SpeechSynthesisUtterance(message);

      u.lang = "zh-TW";

      /*
        方向要比一般說明快一點。
      */
      u.rate =
        isGuidanceKind(kind)
          ? 1.08
          : 0.94;

      u.pitch = 1;
      u.volume = 1;

      const finish = () => {
        /*
          若這個 utterance 已被新方向取消，
          不讓舊的 onend/onerror 干擾目前狀態。
        */
        if (myToken !== speechToken) {
          return;
        }

        speechBusy = false;
        currentSpeechKind = "";
        currentSpeechText = "";

        setTimeout(
          playNextSpeech,
          isGuidanceKind(kind) ? 70 : 160
        );
      };

      u.onend = finish;

      u.onerror = () => {
        if (myToken !== speechToken) {
          return;
        }

        announceByScreenReader(message);
        finish();
      };

      window.speechSynthesis.speak(u);
      return;

    } catch (e) {
      console.warn(
        "speechSynthesis failed",
        e
      );
    }
  }

  announceByScreenReader(message);

  setTimeout(
    playNextSpeech,
    isGuidanceKind(kind) ? 700 : 1200
  );
}


function announceByScreenReader(message) {
  liveRegion.textContent = "";

  setTimeout(() => {
    liveRegion.textContent = message;
  }, 30);
}


function resetSpeech() {
  speechQueue = [];
  pendingGuidance = null;

  speechToken++;

  speechBusy = false;
  currentSpeechKind = "";
  currentSpeechText = "";

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
}


/*
  沒找到時不要一直講。
*/
function speakSearch() {
  const now = Date.now();

  if (now - lastSearchAt < 4800) {
    return;
  }

  lastSearchAt = now;

  const message =
    "目前鏡頭範圍內尚未確認展品。請保持站在原地，慢慢轉動手機。";

  /*
    文字是即時狀態，不等聲音。
  */
  statusVisible.textContent = message;

  if (guidanceAudioEnabled) {
    playCue("search");
  }
}


/*
  疑似展品方向：
  句子刻意縮短，才跟得上手部移動。
*/
function speakNearDirection(best, frameW, frameH) {
  const cx =
    best.x +
    best.w / 2;

  const cy =
    best.y +
    best.h / 2;

  const dx =
    (cx - frameW / 2) /
    frameW;

  const dy =
    (cy - frameH / 2) /
    frameH;

  /*
    疑似階段也只給四方向，
    不再講「左側疑似有展品……」整句。
  */
  if (Math.abs(dx) >= 0.10) {
    requestStableDirection(
      dx > 0
        ? "right"
        : "left"
    );

  } else if (Math.abs(dy) >= 0.12) {
    requestStableDirection(
      dy > 0
        ? "down"
        : "up"
    );
  }
}


/*
  精確方向必須連續兩幀相同才說。
  若從左變右或從右變左，代表很可能「轉過頭」，
  會立刻停止舊方向，說新的修正方向。
*/
function requestStableDirection(key) {
  /*
    到中央：立刻停止上一個方向聲音。
    目前不說第五個詞，用震動告訴使用者已進中央區。
  */
  if (key === "center") {
    rawDirectionKey = "center";
    rawDirectionFrames = 0;

    if (stableDirectionKey !== "center") {
      stableDirectionKey = "center";

      stopDirAudio();

      statusVisible.textContent =
        "已接近中央";

      if ("vibrate" in navigator) {
        navigator.vibrate(
          [70, 45, 70]
        );
      }
    }

    return;
  }

  /*
    連續兩個 frame 都是同方向才採用。
    260ms x 2，大約半秒內確認，
    避免單一雜訊造成左右亂跳。
  */
  if (key === rawDirectionKey) {
    rawDirectionFrames++;

  } else {
    rawDirectionKey = key;
    rawDirectionFrames = 1;
  }

  if (rawDirectionFrames < 2) {
    return;
  }

  /*
    同方向不一直重說。
    只有真的改方向才播放新的兩個字。
  */
  if (key === stableDirectionKey) {
    return;
  }

  stableDirectionKey = key;

  outputDirection(key);
}


function resetDirectionState() {
  rawDirectionKey = "";
  rawDirectionFrames = 0;
  stableDirectionKey = "";
}


/* -----------------------------------------------------
   震動
----------------------------------------------------- */

function vibrate(pattern) {
  if ("vibrate" in navigator) {
    navigator.vibrate(pattern);
  }
}


/* -----------------------------------------------------
   參考照片載入
----------------------------------------------------- */

function waitForImage(img) {
  if (img.complete && img.naturalWidth > 0) {
    return Promise.resolve();
  }

  return new Promise((resolve, reject) => {
    img.addEventListener("load", resolve, { once: true });
    img.addEventListener("error", reject, { once: true });
  });
}


/* -----------------------------------------------------
   12x12 特徵
----------------------------------------------------- */

function normalizeVector(values) {
  let mean = 0;

  for (const v of values) {
    mean += v;
  }

  mean /= values.length;

  let variance = 0;

  for (const v of values) {
    const d = v - mean;
    variance += d * d;
  }

  const std = Math.sqrt(variance / values.length) || 1;

  return values.map(v => (v - mean) / std);
}


function gradientVector(cells) {
  const g = [];

  /*
    水平方向差異
  */
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID - 1; x++) {
      const a = cells[y * GRID + x];
      const b = cells[y * GRID + x + 1];
      g.push(b - a);
    }
  }

  /*
    垂直方向差異
  */
  for (let y = 0; y < GRID - 1; y++) {
    for (let x = 0; x < GRID; x++) {
      const a = cells[y * GRID + x];
      const b = cells[(y + 1) * GRID + x];
      g.push(b - a);
    }
  }

  return normalizeVector(g);
}


function correlation(a, b) {
  let sum = 0;

  for (let i = 0; i < a.length; i++) {
    sum += a[i] * b[i];
  }

  return sum / a.length;
}


/* -----------------------------------------------------
   參考照片 descriptor
----------------------------------------------------- */

function descriptorFromImage(img) {
  const c = document.createElement("canvas");
  c.width = GRID;
  c.height = GRID;

  const ctx = c.getContext("2d", {
    willReadFrequently: true
  });

  ctx.drawImage(img, 0, 0, GRID, GRID);

  const data =
    ctx.getImageData(0, 0, GRID, GRID).data;

  const cells = [];

  for (let i = 0; i < data.length; i += 4) {
    cells.push(
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2]
    );
  }

  return {
    luma: normalizeVector(cells),
    grad: gradientVector(cells)
  };
}


/* -----------------------------------------------------
   Integral Image
----------------------------------------------------- */

function buildIntegral(gray, width, height) {
  const stride = width + 1;

  const integral =
    new Float32Array(
      (width + 1) *
      (height + 1)
    );

  for (let y = 1; y <= height; y++) {
    let rowSum = 0;

    for (let x = 1; x <= width; x++) {
      rowSum +=
        gray[
          (y - 1) * width +
          (x - 1)
        ];

      integral[
        y * stride + x
      ] =
        integral[
          (y - 1) * stride + x
        ] +
        rowSum;
    }
  }

  return integral;
}


function rectMean(
  integral,
  width,
  height,
  x1,
  y1,
  x2,
  y2
) {
  const stride = width + 1;

  x1 = clamp(x1, 0, width);
  x2 = clamp(x2, 0, width);

  y1 = clamp(y1, 0, height);
  y2 = clamp(y2, 0, height);

  if (
    x2 <= x1 ||
    y2 <= y1
  ) {
    return 0;
  }

  const sum =
      integral[y2 * stride + x2]
    - integral[y1 * stride + x2]
    - integral[y2 * stride + x1]
    + integral[y1 * stride + x1];

  return (
    sum /
    ((x2 - x1) * (y2 - y1))
  );
}


/* -----------------------------------------------------
   候選區域 descriptor
----------------------------------------------------- */

function descriptorFromRect(
  integral,
  frameW,
  frameH,
  x,
  y,
  w,
  h
) {
  const cells = [];

  for (let gy = 0; gy < GRID; gy++) {
    for (let gx = 0; gx < GRID; gx++) {
      const x1 =
        Math.round(
          x + gx * w / GRID
        );

      const x2 =
        Math.round(
          x + (gx + 1) * w / GRID
        );

      const y1 =
        Math.round(
          y + gy * h / GRID
        );

      const y2 =
        Math.round(
          y + (gy + 1) * h / GRID
        );

      cells.push(
        rectMean(
          integral,
          frameW,
          frameH,
          x1,
          y1,
          x2,
          y2
        )
      );
    }
  }

  return {
    luma: normalizeVector(cells),
    grad: gradientVector(cells)
  };
}


/* -----------------------------------------------------
   搜尋照片

   舊版只是 8x8 明暗。
   新版同時比較：
   - 明暗分布
   - 局部邊緣 / 紋理方向

   這會比辦公室隔板、螢幕邊框等假目標難很多。
----------------------------------------------------- */

function findBestMatch(
  integral,
  frameW,
  frameH
) {
  let best = null;

  /*
    仍保持低運算量。
  */
  const widths = [
    58,
    78,
    102,
    130,
    160
  ];

  for (const ref of references) {
    for (const w of widths) {
      const h =
        Math.round(w * ref.aspect);

      if (
        w >= frameW ||
        h >= frameH ||
        h < 24
      ) {
        continue;
      }

      const step =
        Math.max(
          7,
          Math.round(w / 7)
        );

      for (
        let y = 0;
        y <= frameH - h;
        y += step
      ) {
        for (
          let x = 0;
          x <= frameW - w;
          x += step
        ) {
          const d =
            descriptorFromRect(
              integral,
              frameW,
              frameH,
              x,
              y,
              w,
              h
            );

          const lumaScore =
            correlation(
              d.luma,
              ref.descriptor.luma
            );

          const gradScore =
            correlation(
              d.grad,
              ref.descriptor.grad
            );

          /*
            明暗占 60%，邊緣占 40%。
          */
          const score =
            lumaScore * 0.60 +
            gradScore * 0.40;

          if (
            !best ||
            score > best.score
          ) {
            best = {
              id: ref.id,
              name: ref.name,

              score,
              lumaScore,
              gradScore,

              x,
              y,
              w,
              h
            };
          }
        }
      }
    }
  }

  return best;
}


/* -----------------------------------------------------
   位置穩定判斷
----------------------------------------------------- */

function isSameCandidate(a, b) {
  if (!a || !b) return false;
  if (a.id !== b.id) return false;

  const acx = a.x + a.w / 2;
  const acy = a.y + a.h / 2;

  const bcx = b.x + b.w / 2;
  const bcy = b.y + b.h / 2;

  const dx =
    Math.abs(acx - bcx);

  const dy =
    Math.abs(acy - bcy);

  /*
    不只要同一張照片，
    位置也不能突然跳到畫面另一邊。
  */
  return (
    dx <= FRAME_W * 0.16 &&
    dy <= workCanvas.height * 0.16
  );
}


/* -----------------------------------------------------
   準備參考照片
----------------------------------------------------- */

async function prepareReferences() {
  try {
    const img1 =
      document.getElementById("ref1");

    const img2 =
      document.getElementById("ref2");

    await Promise.all([
      waitForImage(img1),
      waitForImage(img2)
    ]);

    references = [
      {
        id: 1,
        name: "第一件展品",
        aspect:
          img1.naturalHeight /
          img1.naturalWidth,
        descriptor:
          descriptorFromImage(img1)
      },

      {
        id: 2,
        name: "第二件展品",
        aspect:
          img2.naturalHeight /
          img2.naturalWidth,
        descriptor:
          descriptorFromImage(img2)
      }
    ];

    statusVisible.textContent =
      "照片資料已準備完成。請按「開始相機導覽」。";

  } catch (e) {
    console.error(e);

    statusVisible.textContent =
      "無法載入 p1.jpg 或 p2.jpg。";
  }
}


/* -----------------------------------------------------
   開相機
----------------------------------------------------- */

async function startCamera() {
  try {
    /*
      不等待音訊。先觸發解鎖，但立刻繼續開相機。
    */
    unlockDirAudio().catch(() => {});
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      speak(
        "這個瀏覽器目前無法開啟相機。",
        "normal",
        true
      );

      return;
    }

    /*
      使用者點擊按鈕是語音啟動手勢。
    */
    if ("speechSynthesis" in window) {
      window.speechSynthesis.resume();
    }

    speak(
      "請先停在原地，只轉動手機，不要因為提示向前行走。",
      "normal",
      true
    );

    stream =
      await navigator.mediaDevices.getUserMedia({
        audio: false,

        video: {
          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 640
          },

          height: {
            ideal: 480
          }
        }
      });

    video.srcObject = stream;

    /*
      相機已經取得後，才在背景準備方向音檔。
      不 await。
    */
    prepareDirAudio().catch(() => {});

    await video.play();

    while (
      !video.videoWidth ||
      !video.videoHeight
    ) {
      await sleep(30);
    }

    const ratio =
      video.videoHeight /
      video.videoWidth;

    const frameH =
      Math.round(
        FRAME_W * ratio
      );

    workCanvas.width =
      FRAME_W;

    workCanvas.height =
      frameH;

    preview.width =
      FRAME_W;

    preview.height =
      frameH;

    running = true;

    startButton.hidden = true;
    stopButton.hidden = false;

    candidate = null;
    candidateFrames = 0;
    confirmed = false;
    centeredFrames = 0;
    completed = false;

    lastDirection = "";
    lastDirectionAt = 0;
    lastSearchAt = 0;
    lastNearAt = 0;

    resetDirectionState();
    lastCueKey = "";
    lastCueAt = 0;

    statusVisible.textContent =
      "相機已開啟。請保持站在原地，慢慢左右轉動手機搜尋展品。";

    analyze();

    timer =
      setInterval(
        analyze,
        ANALYZE_MS
      );

  } catch (e) {
    console.error(e);

    const errorName =
      e && e.name
        ? e.name
        : "未知錯誤";

    const errorMessage =
      e && e.message
        ? e.message
        : "";

    statusVisible.textContent =
      "相機開啟失敗：" +
      errorName +
      (errorMessage
        ? "，" + errorMessage
        : "");

    /*
      如果是權限被拒絕，才顯示權限提示。
    */
    if (
      errorName === "NotAllowedError" ||
      errorName === "PermissionDeniedError"
    ) {
      statusVisible.textContent +=
        "。請確認瀏覽器已允許此網站使用相機。";
    }
  }
}


/* -----------------------------------------------------
   結束
----------------------------------------------------- */

function stopCamera() {
  stopDirAudio();
  stopCueAudio();
  guidanceAudioEnabled = false;
  running = false;

  if (timer) {
    clearInterval(timer);
    timer = null;
  }

  if (stream) {
    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream = null;
  }

  video.srcObject = null;

  candidate = null;
  candidateFrames = 0;
  confirmed = false;
  centeredFrames = 0;
  completed = false;

  startButton.hidden = false;
  stopButton.hidden = true;

  resetSpeech();

  speak(
    "相機導覽已結束。",
    "normal",
    true
  );
}


/* -----------------------------------------------------
   分析畫面
----------------------------------------------------- */

function analyze() {
  if (
    !running ||
    completed ||
    video.readyState < 2 ||
    references.length === 0
  ) {
    return;
  }

  const w = workCanvas.width;
  const h = workCanvas.height;

  workCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  previewCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );


  /*
    中央十字，只給明眼測試者看。
  */
  previewCtx.strokeStyle =
    "rgba(255,255,255,.75)";

  previewCtx.lineWidth = 2;
  previewCtx.beginPath();

  previewCtx.moveTo(
    w / 2 - 10,
    h / 2
  );

  previewCtx.lineTo(
    w / 2 + 10,
    h / 2
  );

  previewCtx.moveTo(
    w / 2,
    h / 2 - 10
  );

  previewCtx.lineTo(
    w / 2,
    h / 2 + 10
  );

  previewCtx.stroke();


  const image =
    workCtx.getImageData(
      0,
      0,
      w,
      h
    );

  const gray =
    new Uint8Array(
      w * h
    );

  for (
    let p = 0, i = 0;
    i < image.data.length;
    i += 4, p++
  ) {
    gray[p] =
      0.299 * image.data[i] +
      0.587 * image.data[i + 1] +
      0.114 * image.data[i + 2];
  }

  const integral =
    buildIntegral(
      gray,
      w,
      h
    );

  const best =
    findBestMatch(
      integral,
      w,
      h
    );

  if (!best) {
    speakSearch();
    return;
  }


  const nearEnough =
    best.score >= NEAR_SCORE &&
    best.lumaScore >= NEAR_LUMA_SCORE &&
    best.gradScore >= NEAR_GRAD_SCORE;


  const strongEnough =
    best.score >= MATCH_THRESHOLD &&
    best.lumaScore >= MIN_LUMA_SCORE &&
    best.gradScore >= MIN_GRAD_SCORE;


  /*
    候選位置是否持續穩定。
  */
  if (
    nearEnough &&
    isSameCandidate(
      candidate,
      best
    )
  ) {
    candidateFrames++;

  } else if (nearEnough) {
    candidate = best;
    candidateFrames = 1;
    confirmed = false;
    centeredFrames = 0;

  } else {
    candidate = null;
    candidateFrames = 0;
    confirmed = false;
    centeredFrames = 0;
  }


  debug.textContent =
    "候選：" +
    best.name +
    "｜總分 " +
    best.score.toFixed(3) +
    "｜明暗 " +
    best.lumaScore.toFixed(3) +
    "｜邊緣 " +
    best.gradScore.toFixed(3) +
    "｜穩定幀 " +
    candidateFrames +
    "｜狀態：" +
    (
      strongEnough
        ? "可正式辨識"
        : nearEnough
          ? "疑似展品"
          : "搜尋中"
    );


  /*
  ======================================================
  第一階段：沒有可靠候選
  ======================================================
  */

  if (!nearEnough) {
    speakSearch();
    return;
  }


  /*
  ======================================================
  第二階段：照片可能已經出現在左右/上下附近，
  但還不足以正式宣稱「已辨識」。

  這就是上一版欠缺的附近探索提示。
  ======================================================
  */

  if (
    !strongEnough ||
    candidateFrames <
      REQUIRED_CONFIRM_FRAMES
  ) {
    if (
      candidateFrames >=
      REQUIRED_NEAR_FRAMES
    ) {
      speakNearDirection(
        best,
        w,
        h
      );
    }

    return;
  }


  /*
  ======================================================
  第三階段：正式鎖定展品
  ======================================================
  */

  if (!confirmed) {
    confirmed = true;

    vibrate(80);

    /*
      清除還沒說出口的「疑似」或「尚未找到」，
      但目前正在講的句子仍會完整講完。
    */
    statusVisible.textContent =
      "已偵測到" +
      best.name +
      "。正在協助您將手機鏡頭對準展品。";

    
  }


  /*
    確認後才畫綠框。
  */
  previewCtx.strokeStyle =
    "#00ff55";

  previewCtx.lineWidth = 4;

  previewCtx.strokeRect(
    best.x,
    best.y,
    best.w,
    best.h
  );


  const cx =
    best.x +
    best.w / 2;

  const cy =
    best.y +
    best.h / 2;

  const dx =
    (cx - w / 2) / w;

  const dy =
    (cy - h / 2) / h;


  const horizontalError =
    Math.abs(dx) /
    CENTER_TOL_X;

  const verticalError =
    Math.abs(dy) /
    CENTER_TOL_Y;


  /*
  ======================================================
  精確方向引導
  ======================================================
  */

  if (
    Math.abs(dx) >
      CENTER_TOL_X ||
    Math.abs(dy) >
      CENTER_TOL_Y
  ) {
    centeredFrames = 0;

    if (
      horizontalError >=
      verticalError
    ) {
      if (dx > 0) {
        requestStableDirection(
          "right"
        );

      } else {
        requestStableDirection(
          "left"
        );
      }

    } else {
      if (dy > 0) {
        requestStableDirection(
          "down"
        );

      } else {
        requestStableDirection(
          "up"
        );
      }
    }

    return;
  }


  /*
  ======================================================
  中央穩定判斷
  ======================================================
  */

  centeredFrames++;

  /*
    一進中央區，就用可中斷的短方向語音「停住」，
    立刻取代仍在說的左/右舊方向。
  */
  if (centeredFrames === 1) {
    requestStableDirection(
      "center"
    );
  }


  if (centeredFrames >= 3) {
    /*
      最重要的修正：
      成功後立刻 completed=true。
      analyze() 後面不再繼續產生「很好、已對準」，
      因此不會跳針。
    */
    completed = true;

    vibrate(
      [90, 70, 90]
    );

    /*
      完成訊息屬於 normal：
      會等目前短方向語音結束後完整說完。
      主畫面文字也會在真正開始說時同步更新。
    */
    statusVisible.textContent =
      "已對準" +
      best.name +
      "。展品定位完成。";

    stopDirAudio();
  }
}


/* -----------------------------------------------------
   事件
----------------------------------------------------- */

startButton.addEventListener(
  "click",
  startCamera
);

stopButton.addEventListener(
  "click",
  stopCamera
);

window.addEventListener(
  "pagehide",
  stopCamera
);

prepareReferences();
</script>
</body>
